name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node >= 22.12: exigido pelo Vitest 5 e pelo WebSocket nativo que o
        # cliente do Supabase usa (no Node 20 os testes quebram). Node 20 também
        # está descontinuado nos runners do GitHub.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      # Lint estrito na lógica de negócio (src/lib, incluindo os testes) e nas
      # configs: precisa passar.
      - name: Lint (src/lib + configs)
        run: npm run lint:lib

      - name: Lint (projeto inteiro)
        run: npm run lint

      - name: Testes
        run: npm test

      # A trava do item 1.10 bloqueia build de produção sem Supabase; no CI não
      # há backend, então o build local é liberado explicitamente.
      - name: Build
        run: npm run build
        env:
          VITE_ALLOW_LOCAL_BUILD: 'true'
